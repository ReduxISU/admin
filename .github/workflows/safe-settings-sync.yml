name: safe-settings sync

# Applies .github/settings.yml + .github/repos/*.yml to every repo in the org.
# There is no webhook in this deployment, so config changes take effect on the next run —
# use "Run workflow" after a policy commit rather than waiting for the cron.

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: safe-settings-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SAFE_SETTINGS_VERSION: "2.1.21"
      SAFE_SETTINGS_DIR: ${{ github.workspace }}/.safe-settings-code

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: github-community-projects/safe-settings
          ref: ${{ env.SAFE_SETTINGS_VERSION }}
          path: ${{ env.SAFE_SETTINGS_DIR }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
        working-directory: ${{ env.SAFE_SETTINGS_DIR }}

      # Do not remove. safe-settings 2.1.19 bumped probot to ^14 without updating its own code.
      # probot 14 builds the logger in a lazy async init, so `probot.log` is null until then
      # (probot.js: `log: options.log || null`), while full-sync.js calls probot.log.info() on the
      # line after createProbot() and lib/* call robot.log.trace() the same way. Every run dies at
      # once with "Cannot read properties of null (reading 'info')". Upstream has not fixed it —
      # full-sync.js is byte-identical from 2.1.18 through HEAD. Pin probot back to the last
      # version the code actually expects; drop this step once upstream awaits initialization.
      - run: npm install probot@13.4.7
        working-directory: ${{ env.SAFE_SETTINGS_DIR }}

      - run: npm run full-sync
        working-directory: ${{ env.SAFE_SETTINGS_DIR }}
        env:
          GH_ORG: ${{ vars.SAFE_SETTINGS_GH_ORG }}
          APP_ID: ${{ vars.SAFE_SETTINGS_APP_ID }}
          PRIVATE_KEY: ${{ secrets.SAFE_SETTINGS_PRIVATE_KEY }}
          ADMIN_REPO: admin
          CONFIG_PATH: .github
          DEPLOYMENT_CONFIG_FILE: ${{ github.workspace }}/deployment-settings.yml
