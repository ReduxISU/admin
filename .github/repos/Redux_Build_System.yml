# Admin bypass. rbs is the CI/CD hub every other repo's pipeline calls, so a wedged build system
# blocks all of them at once, and it has a single committer iterating fast.
#
# Delta only — `rules` comes from suborgs/all-repos.yml and merges in by ruleset `name`. Restating
# the full ruleset here appends to the rules array instead of matching it, which produces a
# duplicate pull_request rule.
rulesets:
  - name: require-reviewed-pr
    bypass_actors:
      - actor_id: 1
        actor_type: OrganizationAdmin
        bypass_mode: always
